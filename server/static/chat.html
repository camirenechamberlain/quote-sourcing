<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Describe the job, add photos, and Quoteschmote asks local suppliers for quotes for you.">
  <meta name="theme-color" content="#0B0B0F">
  <title>Quoteschmote | Get quotes without the legwork</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body class="app">
  <header class="topbar">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="15" rx="5" fill="#0B0B0F"/><path d="M7 17 L7 22 L12.5 17 Z" fill="#0B0B0F"/><circle cx="7.5" cy="10.5" r="1.7" fill="#fff"/><circle cx="12" cy="10.5" r="1.7" fill="#fff"/><circle cx="16.5" cy="10.5" r="1.7" fill="#2D4BFF"/></svg>
    <span class="brand"><span class="b1">quote</span><span class="b2">schmote</span></span>
    <button id="new-chat" class="link-btn" type="button" hidden>New request</button>
  </header>

  <main>
    <section id="chat" class="chat landing">
      <div id="log" class="log" aria-live="polite">
        <div id="hero" class="hero">
          <h1>Get quotes without the legwork</h1>
          <p class="lead">Draft and send off quote requests in minutes.</p>
          <div class="chips" id="chips">
            <button type="button" class="chip-btn" data-text="I need a fence repainted">Repaint a fence</button>
            <button type="button" class="chip-btn" data-text="I have a leaking tap that needs fixing">Fix a leaking tap</button>
            <button type="button" class="chip-btn" data-text="I need a kitchen rewired with new power points">Rewire a kitchen</button>
          </div>
        </div>
      </div>
      <div id="quick" class="quick" hidden></div>
      <div id="previews" class="previews" hidden></div>
      <p id="chat-error" class="error chat-error" role="alert"></p>
      <form id="composer" class="composer">
        <label class="attach" for="files" title="Attach photos or PDFs" aria-label="Attach photos or PDFs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </label>
        <input id="files" type="file" accept="image/*,application/pdf,.pdf" multiple hidden>
        <textarea id="text" rows="1" maxlength="2000" placeholder="Describe your job in a few words and add photos or drawings. We read your photos to fill in the details, so you answer fewer questions." aria-label="Describe the job"></textarea>
        <button class="send" type="submit" id="send-btn">Send</button>
      </form>
      <p class="fine landing-only">Free during beta. No sign-up needed to start.</p>
    </section>
  </main>

  <script src="/static/chat.js" defer></script>
</body>
</html>
